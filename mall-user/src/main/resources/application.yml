spring:
  application:
    name: mall-user

server:
  port: 8081

jwt:
  secret: "kubemall-super-secret-key-for-jwt-256bit-example!"
  expiration-ms: 3600000

logging:
  level:
    root: INFO
    com.kubemall.user: DEBUG
    com.kubemall.web: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN

  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"