spring:
  application:
    name: mall-user
  output:
    ansi:
      enabled: always
  datasource:
    url: jdbc:postgresql://postgres:5432/kubemall?currentSchema=user_schema
    username: postgres
    password: 123456
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    
server:
  port: 8081
  # 中文编码设置
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# JWT 配置
jwt:
  secret: "kubemall-super-secret-key-for-jwt-256bit-example!"
  expiration-ms: 3600000

# 日志配置
logging:
  level:
    root: INFO
    # 你自己的模块
    com.kubemall.user: DEBUG
    com.kubemall.user.filter: DEBUG
    com.kubemall.user.aspect: INFO
    # common-web 模块（重要！）
    com.kubemall.web: INFO          # 整个 web 公共模块
    com.kubemall.web.filter: DEBUG  # 具体到 filter，更详细
    # 第三方框架
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
  file:
    path: E:/logs/kubemall/mall-user
    name: E:/logs/kubemall/mall-user/mall-user.log
  logback:
    rollingpolicy:
      max-history: 30

