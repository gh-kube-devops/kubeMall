spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kubemall?currentSchema=user_schema
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: user_schema
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      continue-on-error: true

logging:
  file:
    path: ./logs/mall-user
    name: ./logs/mall-user/mall-user.log