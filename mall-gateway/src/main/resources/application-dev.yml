spring:
  cloud:
    gateway:
      routes:
        - id: mall-user
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**

        - id: mall-product
          uri: http://localhost:8082
          predicates:
            - Path=/api/product/**

logging:
  file:
    name: E:/logs/kubemall/mall-gateway/mall-gateway.log